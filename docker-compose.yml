services:

  mysql:
    image: mysql:latest
    container_name: order-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: orders_user
      MYSQL_PASSWORD: orders_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uorders_user",
          "-porders_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  api:
    build:
      context: ./api

    container_name: order-api
    restart: unless-stopped

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      kafka:
        condition: service_started


  nginx:
    image: nginx:latest
    container_name: order-nginx
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api


  payment-consumer:
    build:
      context: ./consumers

    container_name: order-payment-consumer
    restart: unless-stopped

    command: python -u payment_consumer.py

    depends_on:
      kafka:
        condition: service_started


  delivery-consumer:
    build:
      context: ./consumers

    container_name: order-delivery-consumer
    restart: unless-stopped

    command: python -u delivery_consumer.py

    depends_on:
      kafka:
        condition: service_started

  rabbit-consumer:
    build:
      context: ./consumers

    container_name: order-rabbit-consumer
    restart: unless-stopped

    command: python -u rabbit_consumer.py

    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: order-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    ports:
      - "5672:5672"
      - "15673:15672"

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  kafka:
    image: apache/kafka:3.7.0
    container_name: order-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: order-kafka-ui
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      kafka:
        condition: service_started


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: order-phpmyadmin
    restart: unless-stopped

    ports:
      - "8082:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:
  kafka_data: