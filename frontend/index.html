<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
        }

        .success {
            background: #d4edda;
        }

        .error {
            background: #f8d7da;
        }
    </style>
</head>

<body>

    <h1>Оформление заказа</h1>

    <form id="orderForm">

        <div class="form-group">
            <label for="customer">Клиент</label>
            <input
                type="text"
                id="customer"
                name="customer"
                required
            >
        </div>

        <div class="form-group">
            <label for="product">Товар</label>
            <input
                type="text"
                id="product"
                name="product"
                required
            >
        </div>

        <div class="form-group">
            <label for="amount">Сумма</label>
            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0"
                required
            >
        </div>

        <button type="submit">Создать заказ</button>

    </form>

    <div id="result"></div>

    <script>
        const form = document.getElementById("orderForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const customer = document.getElementById("customer").value;
            const product = document.getElementById("product").value;
            const amount = document.getElementById("amount").value;

            try {
                const response = await fetch("/api/orders", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        customer: customer,
                        product: product,
                        amount: amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    result.className = "success";
                    result.textContent =
                        "Заказ успешно создан. Номер заказа: " + data.order_id;

                    form.reset();
                } else {
                    result.className = "error";
                    result.textContent =
                        "Ошибка: " + (data.error || "Не удалось создать заказ");
                }

            } catch (error) {
                result.className = "error";
                result.textContent =
                    "Ошибка соединения с сервером";
            }
        });
    </script>

</body>
</html>
